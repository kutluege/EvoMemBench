.q{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}

.yn{display:flex;gap:6px}
.yn button{min-width:58px}
.yn button[aria-pressed="true"].y{background:var(--yes);border-color:var(--yes);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--no);border-color:var(--no);color:#fff}
textarea{width:100%;min-height:56px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
label{display:block;color:var(--muted);font-size:.93rem;margin-bottom:4px}
#status{min-height:1.5em;color:var(--muted);font-size:.93rem}
details{margin-top:20px}
summary{cursor:pointer;color:var(--accent)}
pre{white-space:pre-wrap;font:inherit;font-size:.93rem;color:var(--fg);margin:10px 0 0}
@media (max-width:520px){.q{grid-template-columns:1fr}}
</style>

o children, two employers, two fields\n  of work.\n\nJudge only whether the two values can hold together. Do **not** judge whether\neither sentence is true of the real person or thing; many sentences are\ncounterfactual on purpose. \"Confucius is a citizen of the United States\" and\n\"Confucius is a citizen of Canada\" are both false in fact, but the two values\ncan hold together, so the answer is no.\n\nIf a pair is hard to decide, use this test: told that the first sentence is\ntrue, would you say the second is definitely false? If so, answer yes.\n\nAnswer yes or no for every pair (no blanks, no \"unsure\"); use `notes` for\nanything you want to flag. Do not open `strict_key.json`, your earlier sheets\nor anything under `model_annotation/` before you have finished. Hand the\ndownloaded file over as it is, without re-saving it in a spreadsheet program.\n"}, "tr": {"name": "Türkçe", "title": "Katı çatışma incelemesi: kör etiketleme", "sub": "Buradaki her çift zaten bir güncelleme çatışması. Tek bir şeye karar verin: iki cümle o varlık için aynı anda doğru olabilir mi? Cümlelerin gerçek dünyada doğru olup olmadığını kontrol etmeyin. Yanıtlar dosyaya İngilizce (yes/no) kaydedilir.", "prev": "Önceki", "next": "Sonraki", "todo": "Sonraki yanıtsız", "notes": "Notlar (isteğe bağlı)", "download": "CSV indir", "full": "Yönergenin tamamı", "yes": "Evet", "no": "Hayır", "progress": "{n} çiftten {i}. çift ({id}, {subset})  |  {done} tamamlandı", "all_done": "Bütün çiftler tamamlandı.", "saved_partial": "{name} kaydedildi. {missing} çift eksik; puanlayıcı boş hücreleri kabul etmez.", "saved_full": "{name} kaydedildi. {n} çiftin hepsi tamamlandı.", "short": {"strict_conflict": "Evet: iki cümle bu varlık için aynı anda doğru olamaz. Hayır: ikisi birlikte geçerli olabilir."}, "rubric": "# Katı çatışma incelemesi — etiketleyici yönergesi\n\nBu sayfadaki her çift zaten bir güncelleme çatışması sayılıyor: iki cümle de\naynı varlık ve aynı özellik hakkında, ve biri diğerini kapsamayan iki farklı\ndeğer veriyor. Geriye tek soru kalıyor.\n\n`strict_conflict`: iki cümle o varlık için aynı anda doğru olabilir mi?\n\n- Olamıyorsa **evet** (katı çatışma) deyin: biri doğruysa diğeri kesinlikle\n  yanlıştır. Özellik aynı anda tek değer alıyorsa böyledir (başkent, doğum\n  yeri, hükümet başkanı). Özellik birden çok değer alabildiği halde bu iki\n  değer birbirini dışlıyorsa da böyledir; örneğin hiç aynı dönemde var olmamış\n  iki devletin vatandaşlığı.\n- İkisi birlikte geçerli olabiliyorsa, birliktelik ne kadar olası görünmese de\n  **hayır** deyin: konuşulan iki dil, iki çocuk, iki işveren, iki çalışma alanı.\n\nYalnızca iki değerin birlikte geçerli olup olamayacağına bakın. Cümlelerin\ngerçek kişi ya da şey için doğru olup olmadığına **bakmayın**; cümlelerin çoğu\nbilerek karşıolgusaldır. \"Confucius is a citizen of the United States\" ile\n\"Confucius is a citizen of Canada\" gerçekte ikisi de yanlıştır, ama iki değer\nbirlikte geçerli olabilir; yanıt hayırdır.\n\nKarar vermek zorsa şu sınamayı kullanın: ilk cümlenin doğru olduğu söylense,\nikincinin kesinlikle yanlış olduğunu söyler miydiniz? Öyleyse evet deyin.\n\nHer çift için evet ya da hayır deyin (boş bırakmayın, \"emin değilim\" yok);\nbelirtmek istediğiniz her şey için notlar alanını kullanın. Bitirmeden önce\n`strict_key.json` dosyasını, önceki sayfalarınızı ve `model_annotation/`\naltındaki hiçbir şeyi açmayın. İndirilen dosyayı olduğu gibi verin; bir tablo\nprogramında yeniden kaydetmeyin.\n"}}}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var rows = D.rows, cols = D.label_cols, sheetCols = D.sheet_cols;
  var storeKey = "pilot-review-" + D.build_id, langKey = "pilot-review-lang";
  var answers = {}, at = 0, lang = D.lang;

  // The language changes the display only: answers are stored and exported as "yes" / "no".
  try { var saved = localStorage.getItem(langKey); if (saved && D.i18n[saved]) { lang = saved; } } catch (e) {}
  function L() { return D.i18n[lang]; }
  function fmt(s, v) { return s.replace(/\{(\w+)\}/g, function (m, k) { return v[k] === undefined ? m : v[k]; }); }

  try { answers = JSON.parse(localStorage.getItem(storeKey) || "{}") || {}; } catch (e) { answers = {}; }
  function save() { try { localStorage.setItem(storeKey, JSON.stringify(answers)); } catch (e) {} }
  function rec(rid) { if (!answers[rid]) { answers[rid] = {}; } return answers[rid]; }
  function complete(rid) {
    var a = answers[rid] || {};
    return cols.every(function (c) { return a[c] === "yes" || a[c] === "no"; });
  }
  function nDone() { return rows.filter(function (r) { return complete(r.review_id); }).length; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }

  function render() {
    var r = rows[at], a = rec(r.review_id);
    document.getElementById("progress").textContent = fmt(L().progress,
      { i: at + 1, n: rows.length, id: r.review_id, subset: r.subset, done: nDone() });

    var f = document.getElementById("facts");
    f.textContent = "";
    [["A", r.fact_a], ["B", r.fact_b]].forEach(function (p) {
      var line = el("p", "fact");
      line.appendChild(el("span", "tag", p[0]));
      line.appendChild(document.createTextNode(p[1]));
      f.appendChild(line);
    });

    var q = document.getElementById("questions");
    q.textContent = "";
    cols.forEach(function (c) {
      var row = el("div", "q"), left = el("div"), yn = el("div", "yn");
      left.appendChild(el("code", "", c));
      left.appendChild(el("p", "", L().short[c] || ""));
      [["yes", "y", L().yes], ["no", "n", L().no]].forEach(function (o) {
        var b = el("button", o[1], o[2]);
        b.type = "button";
        b.setAttribute("aria-pressed", a[c] === o[0] ? "true" : "false");
        b.setAttribute("aria-label", c + ": " + o[2]);
        b.addEventListener("click", function () {
          a[c] = o[0];
          save();
          render();
        });
        yn.appendChild(b);
      });
      row.appendChild(left);
      row.appendChild(yn);
      q.appendChild(row);
    });
    document.getElementById("notes").value = a.notes || "";
  }

  function go(i) { at = Math.max(0, Math.min(rows.length - 1, i)); render(); window.scrollTo(0, 0); }

  function applyLang() {
    var t = L(), other = D.langs.filter(function (x) { return x !== lang; })[0];
    document.documentElement.lang = lang;
    document.title = t.title;
    [["t_title", "title"], ["t_sub", "sub"], ["prev", "prev"], ["next", "next"], ["todo", "todo"],
     ["t_notes", "notes"], ["download", "download"], ["t_full", "full"], ["rubric", "rubric"]]
      .forEach(function (p) { document.getElementById(p[0]).textContent = t[p[1]]; });
    document.getElementById("lang").textContent = D.i18n[other].name;
    document.getElementById("status").textContent = "";
    render();
  }
  document.getElementById("lang").addEventListener("click", function () {
    lang = D.langs.filter(function (x) { return x !== lang; })[0];
    try { localStorage.setItem(langKey, lang); } catch (e) {}
    applyLang();
  });

  document.getElementById("notes").addEventListener("input", function (ev) {
    rec(rows[at].review_id).notes = ev.target.value;
    save();
  });
  document.getElementById("prev").addEventListener("click", function () { go(at - 1); });
  document.getElementById("next").addEventListener("click", function () { go(at + 1); });
  document.getElementById("todo").addEventListener("click", function () {
    for (var k = 1; k <= rows.length; k++) {
      var i = (at + k) % rows.length;
      if (!complete(rows[i].review_id)) { go(i); return; }
    }
    document.getElementById("status").textContent = L().all_done;
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.target && ev.target.tagName === "TEXTAREA") { return; }
    if (ev.key === "ArrowLeft") { go(at - 1); }
    if (ev.key === "ArrowRight") { go(at + 1); }
  });

  function cell(v) { return '"' + String(v === undefined || v === null ? "" : v).replace(/"/g, '""') + '"'; }
  document.getElementById("download").addEventListener("click", function () {
    var lines = [sheetCols.join(",")];
    rows.forEach(function (r) {
      var a = answers[r.review_id] || {};
      lines.push(sheetCols.map(function (c) {
        if (c === "review_id" || c === "subset" || c === "fact_a" || c === "fact_b") { return cell(r[c]); }
        return cell(a[c]);
      }).join(","));
    });
    var missing = rows.length - nDone();
    var name = missing ? "strict_sheet.partial.csv" : "strict_sheet.filled.csv";
    var blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    document.getElementById("status").textContent = fmt(missing ? L().saved_partial : L().saved_full,
      { name: name, missing: missing, n: rows.length });
  });

  for (var i = 0; i < rows.length; i++) { if (!complete(rows[i].review_id)) { at = i; break; } }
  applyLang();
})();
</script>
</body>
</html>
